<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrazione Numerica - Omnia</title>
    <link href="https://i.postimg.cc/MGJgF2VH/foto.png" rel="icon" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/MGJgF2VH/foto.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            align-self: flex-start;
            text-decoration: none;
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .title {
            font-size: 1.2rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .inputs-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #6b7280;
            text-transform: uppercase;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #ffffff;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }

        .btn-extract {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0284c7;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 25px;
        }

        .btn-extract:active {
            opacity: 0.8;
        }

        /* Risultato estratto */
        .result-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
        }

        .result-label {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        .result-display {
            font-size: 4rem;
            font-weight: bold;
            font-family: monospace;
            color: #38bdf8;
            line-height: 1;
        }
    </style>
</head>
<body>

    <a href="menu.html" class="back-btn">← Torna al Menu</a>

    <div class="card">
        <div class="title">Estrazione Numerica</div>

        <!-- Inserimento Intervallo -->
        <div class="inputs-row">
            <div class="input-group">
                <label for="min-num">Da</label>
                <input type="number" id="min-num" value="1" min="1">
            </div>
            <div class="input-group">
                <label for="max-num">A</label>
                <input type="number" id="max-num" value="30">
            </div>
        </div>

        <div id="error" class="error-msg">Il valore minimo dev'essere minore o uguale al massimo!</div>

        <button type="button" class="btn-extract" onclick="estraiNumero()">Estrai Numero</button>

        <!-- Risultato dell'estrazione -->
        <div class="result-box">
            <div class="result-label">Numero Estratto</div>
            <div id="result" class="result-display">--</div>
        </div>
    </div>

    <script>
        /* 
           TABELLA DEI PESI / PERCENTUALI (da 1 a 30)
           Modifica il valore accanto a ciascun numero nel codice per cambiare le sue probabilità relative.
           Un valore più alto = maggiore probabilità di essere estratto.
        */
        const pesiPersonalizzati = {
            1: 1,  2: 1,  3: 1,  4: 1,  5: 1,
            6: 1,  7: 1,  8: 1,  9: 1,  10: 1,
            11: 1, 12: 1, 13: 1, 14: 1, 15: 1,
            16: 1, 17: 1, 18: 1, 19: 1, 20: 1,
            21: 1, 22: 1, 23: 1, 24: 1, 25: 1,
            26: 1, 27: 1, 28: 1, 29: 1, 30: 1
        };

        function estraiNumero() {
            const minInput = document.getElementById('min-num').value;
            const maxInput = document.getElementById('max-num').value;
            const errorElement = document.getElementById('error');
            const display = document.getElementById('result');

            const min = parseInt(minInput, 10);
            const max = parseInt(maxInput, 10);

            // Controllo validità
            if (isNaN(min) || isNaN(max) || min > max) {
                errorElement.style.display = 'block';
                display.textContent = '--';
                return;
            } else {
                errorElement.style.display = 'none';
            }

            // Calcolo totale dei pesi
            let pesoTotale = 0;
            let elementi = [];

            for (let i = min; i <= max; i++) {
                let peso = (pesiPersonalizzati[i] !== undefined) ? pesiPersonalizzati[i] : 1;
                elementi.push({ numero: i, peso: peso });
                pesoTotale += peso;
            }

            if (pesoTotale <= 0) {
                errorElement.textContent = "I pesi inseriti impediscono l'estrazione!";
                errorElement.style.display = 'block';
                return;
            }

            // Algoritmo di estrazione casuale ponderata
            let rand = Math.random() * pesoTotale;
            let estratto = elementi[elementi.length - 1].numero; // Fallback sull'ultimo

            for (let item of elementi) {
                if (rand <= item.peso) {
                    estratto = item.numero;
                    break;
                }
                rand -= item.peso;
            }

            // Animazione veloce estrazione
            let counter = 0;
            let speedInterval = setInterval(() => {
                display.textContent = Math.floor(Math.random() * (max - min + 1)) + min;
                counter++;
                if (counter >= 12) {
                    clearInterval(speedInterval);
                    display.textContent = estratto;
                }
            }, 35);
        }
    </script>
</body>
</html>
