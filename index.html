<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Omnia</title>
     <link href="foto.png" rel="icon" type="image/png">
<link rel="apple-touch-icon" href="foto.png">
    <!-- Icona per iPhone -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/MGJgF2VH/foto.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/MGJgF2VH/foto.png">
    <style>
        body {
            background-image: url('https://i.postimg.cc/J0fZ3W24/Background-2.png');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 350px;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            border: 1px solid #2d2d2d;
            box-sizing: border-box;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
            color: #ff66b2; /* Colore rosa stile Glide */
        }
        .card p {
            margin: 0;
            font-size: 14px;
            color: #b3b3b3;
            line-height: 1.4;
        }
        /* Stile del Banner di Aiuto per le Scorciatoie */
        #shortcut-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff66b2;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
            z-index: 1000;
            width: 90%;
            max-width: 320px;
        }        
    </style>
</head>
<body>

    <h1>Omnia</h1>

    <!-- SCHEDA 1 -->
    <a href="https://microscopio-9.webnode.it/" class="card">
        <h2>Citologia</h2>
        <p>Galleria di vetrini e osservazioni al microscopio.</p>
    </a>

    <!-- SCHEDA 2 -->
    <a href="https://il-mio-sito-web-59sgr9.webnode.it/" class="card">
        <h2>Stampe 3D</h2>
        <p>Qui si possono trovare tutte le stampe eseguite, preferite o future divise in argomenti.</p>
    </a>
    <!-- SCHEDA 3 -->
    <a href="menu.html" class="card">
        <h2>Insegnanti</h2>
        <p>Risorse utili.</p>
    </a>

    <!-- Bottone per l'area riservata -->
<button onclick="verificaPassword()" class="protected-btn">🔐 Area Riservata</button>

<style>
    .protected-btn {
        background: #1f2937;
        border: 1px solid #374151;
        color: #38bdf8;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }
    .protected-btn:hover {
        background: #374151;
    }
</style>

<script>
    function verificaPassword() {
        // Inserisci qui la password che desideri impostare
        const passwordCorretta = "omnia123";
        const inserita = prompt("Inserisci la password di accesso:");
        
        if (inserita === passwordCorretta) {
            // Sostituisci 'pagina-segreta.html' con il percorso del file che vuoi aprire
            window.location.href = "pagina-segreta.html";
        } else if (inserita !== null) {
            alert("Password errata!");
        }
    }
</script>
    
    <!-- Banner che compare dinamicamente -->
    <div id="shortcut-banner" style="display: none;"></div>

    <script>
        // Sistema di rilevamento automatico del telefono/PC
        window.addEventListener('DOMContentLoaded', () => {
            const banner = document.getElementById('shortcut-banner');
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

            // Se l'utente usa un dispositivo Apple (iPhone/Mac) o il browser Safari
            if (isIOS || isSafari || isMac) {
                banner.innerHTML = "📲 Su Safari: Premi <b>Condividi</b> (🗂️) e poi <b>Aggiungi alla schermata Home</b>";
                banner.style.display = 'block';
            } 
            // Se l'utente usa un dispositivo Android o Windows (Chrome/Edge)
            else {
                banner.innerHTML = "📲 Su Android/Chrome: Premi i <b>3 puntini</b> (⋮) e seleziona <b>Crea scorciatoia</b>";
                banner.style.display = 'block';
            }
        });
        // LOGICA SEGRETA: 5 CLICK SULLA SCRITTA OMNIA -> PASSWORD ADMIN
        let clickCount = 0;
        // Seleziona il titolo principale dell'applicazione (l'elemento h1 con scritto Omnia)
        const titleTrigger = document.querySelector('h1');

        if (titleTrigger) {
            // Rende la scritta cliccabile e impedisce che venga selezionato il testo per errore durante i click veloci
            titleTrigger.style.cursor = 'pointer';
            titleTrigger.style.userSelect = 'none';
            titleTrigger.style.webkitUserSelect = 'none';
            
            titleTrigger.addEventListener('click', () => {
                clickCount++;
                if (clickCount === 5) {
                    clickCount = 0; // Resetta il contatore
                    
                    // Fa comparire la finestrella nativa del telefono per chiedere la password
                    const passwordInput = prompt("🔒 ACCESSO ADMIN\nInserisci la password di amministrazione per accedere al reparto segreto:");
                    
                    // Controlla se la password è corretta (puoi cambiare "omnia123" con la tua password preferita)
                    if (passwordInput === "omnia123") {
                        alert("✅ Password corretta. Reindirizzamento in corso...");
                        // Ti manda direttamente al tuo sito segreto (SOSTITUISCI IL LINK QUI SOTTO)
                        window.location.href = "https://il-mio-sito-web-59sgr9.webnode.it/nascosto/";
                    } else if (passwordInput !== null) {
                        alert("❌ Password errata. Accesso negato.");
                    }
                }
            });
        }
    
    </script>
</body>
</html>
