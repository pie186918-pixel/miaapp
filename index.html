<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Omnia</title>
    <!-- Icona per iPhone -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/MGJgF2VH/foto.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/MGJgF2VH/foto.png">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 350px;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            border: 1px solid #2d2d2d;
            box-sizing: border-box;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
            color: #ff66b2; /* Colore rosa stile Glide */
        }
        .card p {
            margin: 0;
            font-size: 14px;
            color: #b3b3b3;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Omnia</h1>

    <!-- SCHEDA 1 -->
    <a href="https://microscopio-9.webnode.it/" class="card">
        <h2>Citologia</h2>
        <p>Galleria di vetrini e osservazioni al microscopio.</p>
    </a>

    <!-- SCHEDA 2 -->
    <a href="https://il-mio-sito-web-59sgr9.webnode.it/" class="card">
        <h2>Stampe 3D</h2>
        <p>Qui si possono trovare tutte le stampe stampate, preferite o future divise in argomenti.</p>
    </a>

</body>
</html>
