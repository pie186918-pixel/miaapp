<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia - Workspace & Search</title>
    <!-- KaTeX per le formule matematiche dell'IA -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            padding: 15px;
            overflow: hidden;
        }

        /* Layout principale a 2 colonne affiancate */
        .workspace-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            height: 100%;
        }

        .column {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .column-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 10px;
        }

        /* BARRA DI RICERCA CON FILTRO */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
        }

        .search-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #0369a1;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #ffffff;
        }

        /* CHAT IA CON FORMATTAZIONE GRASSETTO / KATEX */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
        }

        .message.ai {
            background: #1f2937;
            color: #e5e7eb;
            align-self: flex-start;
            border: 1px solid #374151;
        }

        .chat-input-box {
            display: flex;
            gap: 8px;
        }

        /* Responsiveness per schermi piccoli */
        @media (max-width: 768px) {
            body {
                overflow: auto;
            }
            .workspace-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .column {
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <div class="workspace-container">
        
        <!-- COLONNA SINISTRA: MOTORE DI RICERCA FILTRATO -->
        <div class="column">
            <div class="column-header">
                🔍 Ricerca Web Protetta
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Cerca su Google (senza YouTube e distrazioni)..." onkeydown="if(event.key==='Enter') eseguiRicercaFiltrata()">
                <button onclick="eseguiRicercaFiltrata()" class="search-btn">Cerca</button>
            </div>

            <!-- Frame dei risultati di ricerca -->
            <iframe id="searchFrame" class="iframe-container" src="about:blank"></iframe>
        </div>

        <!-- COLONNA DESTRAM: ASSISTENTE IA -->
        <div class="column">
            <div class="column-header">
                🤖 Assistente Scientifico Omnia
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="message ai">Ciao Pietro! Sono pronto ad aiutarti. Chiedimi spiegazioni o calcoli sulle tue ricerche.</div>
            </div>

            <div class="chat-input-box">
                <input type="text" id="aiInput" class="search-input" placeholder="Chiedi all'IA..." onkeydown="if(event.key==='Enter') inviaMessaggioIA()">
                <button onclick="inviaMessaggioIA()" class="search-btn">Invia</button>
            </div>
        </div>

    </div>

    <script>
        // LISTA NERA: Aggiungi qui tutti i domini che vuoi rendere "inesistenti"
        const sitiDaEscludere = [
            "youtube.com",
            "youtu.be",
            "tiktok.com",
            "instagram.com",
            "facebook.com"
        ];

        // FUNZIONE DI RICERCA CON BLOCCO INVISIBILE
        function eseguiRicercaFiltrata() {
            const query = document.getElementById("searchInput").value.trim();
            if (!query) return;

            // Genera la stringa di esclusione (es: -site:youtube.com -site:tiktok.com)
            const filtriEsclusione = sitiDaEscludere.map(sito => `-site:${sito}`).join(" ");
            
            // Unisce la ricerca dell'utente con i filtri trasparenti
            const queryFinale = encodeURIComponent(`${query} ${filtriEsclusione}`);
            
            // Reindirizza la ricerca a Google in modo pulito
            const urlRicerca = `https://www.google.com/search?q=${queryFinale}&igu=1`;
            
            document.getElementById("searchFrame").src = urlRicerca;
        }

        // FUNZIONE PER FORMATTARE IL GRASSETTO (NO MARKDOWN TABLES)
        function formattaGrassetto(testo) {
            return testo.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        }

        // CHAT IA INTEGRATA
        function inviaMessaggioIA() {
            const input = document.getElementById("aiInput");
            const testo = input.value.trim();
            if (!testo) return;

            const chatMessages = document.getElementById("chatMessages");

            // Messaggio Utente
            const userMsg = document.createElement("div");
            userMsg.className = "message user";
            userMsg.textContent = testo;
            chatMessages.appendChild(userMsg);

            input.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Risposta simulata / Integrazione Groq
            setTimeout(() => {
                const aiMsg = document.createElement("div");
                aiMsg.className = "message ai";
                
                let rispostaGrezza = "Ecco un esempio di risposta: **concetto chiave** e formula $E = mc^2$.";
                aiMsg.innerHTML = formattaGrassetto(rispostaGrezza);
                
                chatMessages.appendChild(aiMsg);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Renderizza KaTeX per le formule
                if (window.renderMathInElement) {
                    renderMathInElement(aiMsg, {
                        delimiters: [
                            {left: "$$", right: "$$", display: true},
                            {left: "$", right: "$", display: false}
                        ]
                    });
                }
            }, 600);
        }
    </script>
</body>
</html>
