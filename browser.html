<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia Workspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #e5e7eb; font-family: system-ui, sans-serif; height: 100vh; padding: 10px; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; }
        .panel { background: #111827; border: 1px solid #1f2937; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; padding: 15px; }
        
        /* Barra di ricerca */
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-box input { flex: 1; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 8px; outline: none; }
        .search-box button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Contenitore risultati */
        .results-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .result-item { background: #1f2937; padding: 12px; border-radius: 8px; border: 1px solid #374151; }
        .result-item a { color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 1.05rem; }
        .result-item a:hover { text-decoration: underline; }
        .result-item p { font-size: 0.9rem; color: #9ca3af; margin-top: 5px; }

        /* Frame per la tua IA */
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- COLONNA RICERCA INTEGRATA -->
        <div class="panel">
            <h3 style="color: #38bdf8; margin-bottom: 10px;">🔍 Ricerca Omnia</h3>
            <div class="search-box">
                <input type="text" id="queryInput" placeholder="Cerca nel web..." onkeydown="if(event.key==='Enter') eseguiRicerca()">
                <button onclick="eseguiRicerca()">Cerca</button>
            </div>
            <div id="results" class="results-container">
                <p style="color: #6b7280;">Digita qualcosa per cercare nel web...</p>
            </div>
        </div>

        <!-- COLONNA IA (la tua pagina ia.html) -->
        <div class="panel" style="padding: 0;">
            <iframe src="ia.html"></iframe>
        </div>
    </div>

    <script>
        // Inserisci le tue chiavi ottenute da Google Cloud / Programmable Search
        const GOOGLE_API_KEY = "LA_TUA_GOOGLE_API_KEY";
        const SEARCH_ENGINE_CX = "IL_TUO_CX_ID";

        // Siti che rendiamo "inesistenti"
        const dominiEsclusi = ["youtube.com", "youtu.be", "tiktok.com", "instagram.com"];

        async function eseguiRicerca() {
            const query = document.getElementById("queryInput").value.trim();
            const container = document.getElementById("results");
            if (!query) return;

            container.innerHTML = "<p>Ricerca in corso...</p>";

            // Costruiamo i filtri -site: per l'API
            const filtri = dominiEsclusi.map(d => `-site:${d}`).join(" ");
            const queryFiltrata = encodeURIComponent(`${query} ${filtri}`);

            const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${SEARCH_ENGINE_CX}&q=${queryFiltrata}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                container.innerHTML = "";

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = "<p>Nessun risultato trovato.</p>";
                    return;
                }

                // Generiamo i risultati direttamente dentro Omnia senza iframe esterni
                data.items.forEach(item => {
                    const div = document.createElement("div");
                    div.className = "result-item";
                    div.innerHTML = `
                        <a href="${item.link}" target="_blank">${item.title}</a>
                        <p>${item.snippet}</p>
                    `;
                    container.appendChild(div);
                });

            } catch (err) {
                container.innerHTML = "<p style='color: #ef4444;'>Errore durante la ricerca. Verifica la chiave API.</p>";
            }
        }
    </script>
</body>
</html>
