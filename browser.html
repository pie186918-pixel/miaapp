<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia - Advanced Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* Layout 2 Colonne Affiancate */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .pane {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        .pane-title {
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Barra di Ricerca */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .search-input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
        }

        .search-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #0369a1;
        }

        /* Sezione Cronologia Ricerche Recenti */
        .history-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 10px;
            padding-bottom: 4px;
            white-space: nowrap;
        }

        .history-bar::-webkit-scrollbar {
            height: 4px;
        }

        .history-bar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        .history-chip {
            background: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-chip:hover {
            background: #374151;
            color: #fff;
        }

        /* Pulsanti di cambio vista (Siti / Foto) */
        .view-switcher {
            display: none;
            gap: 8px;
            margin-bottom: 12px;
        }

        .view-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: #0284c7;
            color: white;
            border-color: #0284c7;
        }

        /* Contenitore Risultati */
        .results-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .result-card {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 12px 15px;
            border-radius: 10px;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .result-favicon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            object-fit: contain;
        }

        .result-card a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
        }

        .result-card a:hover {
            text-decoration: underline;
        }

        .result-card p {
            color: #9ca3af;
            font-size: 0.88rem;
            margin-top: 4px;
            line-height: 1.4;
        }

        /* Griglia Immagini Avanzata */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .image-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }

        .image-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: #0b0f19;
        }

        .image-card span {
            font-size: 0.75rem;
            color: #d1d5db;
            padding: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Frame IA */
        .ia-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .workspace { grid-template-columns: 1fr; height: auto; }
            .pane { height: 500px; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        
        <!-- COLONNA SINISTRA: BROWSER AVANZATO WEB & FOTO -->
        <div class="pane">
            <div class="pane-title">
                <span>🌐 Omnia Browser v3.0</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Cerca qualsiasi argomento..." onkeydown="if(event.key==='Enter') avviaRicerca(document.getElementById('searchInput').value)">
                <button onclick="avviaRicerca(document.getElementById('searchInput').value)" class="search-btn">Cerca</button>
            </div>

            <!-- Cronologia Ricerche Recenti -->
            <div class="history-bar" id="historyBar"></div>

            <!-- Pulsanti di cambio vista (Siti / Foto) -->
            <div class="view-switcher" id="viewSwitcher">
                <button class="view-btn active" id="btnWeb" onclick="mostraSitiWeb()">🌐 Siti Web</button>
                <button class="view-btn" id="btnFoto" onclick="mostraFoto()">🖼️ Foto Reali</button>
            </div>

            <div id="resultsList" class="results-container">
                <p style="color: #6b7280; font-size: 0.9rem;">Digita una parola o seleziona una ricerca recente per iniziare.</p>
            </div>
        </div>

        <!-- COLONNA DESTRA: LA TUA IA (ia.html) -->
        <div class="pane" style="padding: 0;">
            <iframe src="ia.html" class="ia-frame"></iframe>
        </div>

    </div>

    <script>
        let ultimaQuery = "";
        let cacheSitiHtml = "";

        // Carica la cronologia all'avvio
        document.addEventListener("DOMContentLoaded", aggiornaCronologiaUI);

        async function avviaRicerca(queryTesto) {
            const query = queryTesto.trim();
            if (!query) return;

            document.getElementById("searchInput").value = query;
            ultimaQuery = query;
            salvaCronologia(query);

            const container = document.getElementById("resultsList");
            container.innerHTML = "<p style='color: #9ca3af;'>Ricerca in corso...</p>";
            document.getElementById("viewSwitcher").style.display = "flex";
            document.getElementById("btnWeb").classList.add("active");
            document.getElementById("btnFoto").classList.remove("active");

            try {
                const proxyUrl = `https://api.allorigins.win/get?url=` + encodeURIComponent(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`);
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (!data.contents) throw new Error("Errore di caricamento");

                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const results = doc.querySelectorAll('.result');

                let htmlContent = "";

                if (!results || results.length === 0) {
                    container.innerHTML = "<p style='color: #9ca3af;'>Nessun risultato trovato.</p>";
                    return;
                }

                results.forEach(el => {
                    const titleEl = el.querySelector('.result__title');
                    const snippetEl = el.querySelector('.result__snippet');

                    if (titleEl && snippetEl) {
                        const title = titleEl.innerText;
                        const snippet = snippetEl.innerText;
                        const rawHref = titleEl.querySelector('a')?.getAttribute('href') || '#';
                        
                        let cleanUrl = rawHref;
                        if (rawHref.includes('uddg=')) {
                            const match = rawHref.match(/uddg=([^&]+)/);
                            if (match) cleanUrl = decodeURIComponent(match[1]);
                        }

                        // Estrae il dominio per ricavare la favicon ufficiale
                        let domain = "";
                        try {
                            domain = new URL(cleanUrl).hostname;
                        } catch (e) {
                            domain = "google.com";
                        }
                        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;

                        htmlContent += `
                            <div class="result-card">
                                <div class="result-header">
                                    <img src="${faviconUrl}" class="result-favicon" onerror="this.style.display='none'">
                                    <a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${title}</a>
                                </div>
                                <p>${snippet}</p>
                            </div>
                        `;
                    }
                });

                cacheSitiHtml = htmlContent;
                container.innerHTML = cacheSitiHtml;

            } catch (err) {
                container.innerHTML = `
                    <div class="result-card">
                        <a href="https://duckduckgo.com/?q=${encodeURIComponent(query)}" target="_blank">Apri i risultati completi per "${query}" ↗</a>
                        <p>Clicca per visualizzare la ricerca approfondita nel browser.</p>
                    </div>
                `;
            }
        }

        function mostraSitiWeb() {
            document.getElementById("btnWeb").classList.add("active");
            document.getElementById("btnFoto").classList.remove("active");
            document.getElementById("resultsList").innerHTML = cacheSitiHtml || "<p style='color: #9ca3af;'>Nessuna ricerca recente.</p>";
        }

        async function mostraFoto() {
            if (!ultimaQuery) return;
            document.getElementById("btnFoto").classList.add("active");
            document.getElementById("btnWeb").classList.remove("active");

            const container = document.getElementById("resultsList");
            container.innerHTML = "<p style='color: #9ca3af;'>Caricamento foto reali in corso...</p>";

            try {
                // Interroghiamo Wikimedia Commons per immagini mirate e di alta qualità
                const wikiUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(ultimaQuery)}&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url&format=json&origin=*`;
                
                const response = await fetch(wikiUrl);
                const data = await response.json();

                let gridHtml = `
                    <div style="margin-bottom: 8px; color: #9ca3af; font-size: 0.85rem;">Foto reali per: <b>${ultimaQuery}</b></div>
                    <div class="image-grid">
                `;

                let trovate = false;
                if (data.query && data.query.pages) {
                    const pages = data.query.pages;
                    for (let id in pages) {
                        const page = pages[id];
                        if (page.imageinfo && page.imageinfo[0] && page.imageinfo[0].url) {
                            trovate = true;
                            const imgUrl = page.imageinfo[0].url;
                            let title = page.title.replace(/^File:/i, '').replace(/\.[^/.]+$/, "");
                            
                            gridHtml += `
                                <a href="${imgUrl}" target="_blank" class="image-card">
                                    <img src="${imgUrl}" alt="${title}" loading="lazy">
                                    <span>${title}</span>
                                </a>
                            `;
                        }
                    }
                }

                gridHtml += `</div>`;

                if (!trovate) {
                    container.innerHTML = "<p style='color: #9ca3af;'>Nessuna immagine trovata per questa ricerca.</p>";
                } else {
                    container.innerHTML = gridHtml;
                }

            } catch (err) {
                container.innerHTML = "<p style='color: #ef4444;'>Errore durante il recupero delle immagini.</p>";
            }
        }

        // Gestione Cronologia con localStorage
        function salvaCronologia(query) {
            let cronologia = JSON.parse(localStorage.getItem("omnia_history")) || [];
            cronologia = cronologia.filter(item => item.toLowerCase() !== query.toLowerCase());
            cronologia.unshift(query);
            if (cronologia.length > 8) cronologia.pop(); // Mantieni le ultime 8
            localStorage.setItem("omnia_history", JSON.stringify(cronologia));
            aggiornaCronologiaUI();
        }

        function aggiornaCronologiaUI() {
            const bar = document.getElementById("historyBar");
            const cronologia = JSON.parse(localStorage.getItem("omnia_history")) || [];
            
            if (cronologia.length === 0) {
                bar.style.display = "none";
                return;
            }

            bar.style.display = "flex";
            bar.innerHTML = "";
            cronologia.forEach(item => {
                const chip = document.createElement("div");
                chip.className = "history-chip";
                chip.innerText = item;
                chip.onclick = () => avviaRicerca(item);
                bar.appendChild(chip);
            });
        }
    </script>
</body>
</html>
