<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia - Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* Layout 2 Colonne Affiancate */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .pane {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        .pane-title {
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Barra di Ricerca */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
        }

        .search-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #0369a1;
        }

        /* Contenitore Risultati */
        .results-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .result-card {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 12px 15px;
            border-radius: 10px;
        }

        .result-card a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
        }

        .result-card a:hover {
            text-decoration: underline;
        }

        .result-card p {
            color: #9ca3af;
            font-size: 0.88rem;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* Frame per caricare la tua IA */
        .ia-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .workspace { grid-template-columns: 1fr; height: auto; }
            .pane { height: 500px; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        
        <!-- COLONNA SINISTRA: MOTORE DI RICERCA FILTRATO -->
        <div class="pane">
            <div class="pane-title">
                <span>🔍 Ricerca Web Filtrata</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Cerca nel web..." onkeydown="if(event.key==='Enter') eseguiRicerca()">
                <button onclick="eseguiRicerca()" class="search-btn">Cerca</button>
            </div>

            <div id="resultsList" class="results-container">
                <p style="color: #6b7280; font-size: 0.9rem;">Digita un termine e premi Cerca per vedere i risultati.</p>
            </div>
        </div>

        <!-- COLONNA DESTRA: LA TUA IA (ia.html) -->
        <div class="pane" style="padding: 0;">
            <iframe src="ia.html" class="ia-frame"></iframe>
        </div>

    </div>

    <script>
        // --- INSERISCI QUI LE TUE CREDENZIALI GOOGLE ---
        const GOOGLE_API_KEY = "AIzaSyB4p7aNsKRrxBW0VbIgxTEoaassiwAMWfM";
        const SEARCH_ENGINE_CX = "85a74d448db8d4338";

        async function eseguiRicerca() {
            const input = document.getElementById("searchInput");
            const container = document.getElementById("resultsList");
            const query = input.value.trim();

            if (!query) return;

            container.innerHTML = "<p style='color: #9ca3af;'>Ricerca in corso su Google...</p>";

            const url = `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_API_KEY}&cx=${SEARCH_ENGINE_CX}&q=${encodeURIComponent(query)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                container.innerHTML = "";

                if (data.error) {
                    container.innerHTML = `<p style='color: #ef4444;'>Errore Google API: ${data.error.message}</p>`;
                    return;
                }

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = "<p style='color: #9ca3af;'>Nessun risultato trovato per questa ricerca.</p>";
                    return;
                }

                // Genera le card per ogni risultato filtrato
                data.items.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "result-card";
                    card.innerHTML = `
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                        <p>${item.snippet}</p>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                container.innerHTML = "<p style='color: #ef4444;'>Errore nella trasmissione della ricerca. Controlla la connessione.</p>";
            }
        }
    </script>
</body>
</html>
