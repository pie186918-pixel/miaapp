<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia - Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* Layout 2 Colonne Affiancate */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .pane {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-header {
            background: #1f2937;
            padding: 10px 16px;
            font-weight: bold;
            color: #38bdf8;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* BARRA DI RICERCA OMNIA */
        .search-bar-container {
            padding: 10px;
            background: #111827;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #1f2937;
        }

        .search-input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
        }

        .search-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* FRAME CONTENT */
        .frame-content {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .workspace { grid-template-columns: 1fr; height: auto; }
            .pane { height: 550px; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        
        <!-- COLONNA 1: RICERCA WEB BLOCCATA -->
        <div class="pane">
            <div class="pane-header">
                🔍 Motore di Ricerca Omnia (Filtrato)
            </div>
            
            <div class="search-bar-container">
                <input type="text" id="omniaSearchInput" class="search-input" placeholder="Cerca nel web..." onkeydown="if(event.key==='Enter') avviaRicercaOmnia()">
                <button onclick="avviaRicercaOmnia()" class="search-btn">Cerca</button>
            </div>

            <iframe id="searchView" class="frame-content" src="about:blank"></iframe>
        </div>

        <!-- COLONNA 2: LA TUA IA (ia.html) -->
        <div class="pane">
            <div class="pane-header">
                🤖 Assistente IA (ia.html)
            </div>
            <!-- Carica direttamente la tua pagina ia.html esistente -->
            <iframe src="ia.html" class="frame-content" style="background: transparent;"></iframe>
        </div>

    </div>

    <script>
        // Dominio / Siti da rendere "inesistenti"
        const dominiVietati = [
            "youtube.com",
            "youtu.be",
            "tiktok.com",
            "instagram.com",
            "facebook.com"
        ];

        function avviaRicercaOmnia() {
            const input = document.getElementById("omniaSearchInput");
            const testo = input.value.trim();
            if (!testo) return;

            // Costruiamo i filtri -site: per ogni dominio vietato
            const clausoleEsclusione = dominiVietati.map(d => `-site:${d}`).join(" ");
            const queryCompleta = encodeURIComponent(`${testo} ${clausoleEsclusione}`);

            // Utilizza DuckDuckGo o Google in modalità pulita integrata
            // DuckDuckGo rispetta l'embed e i filtri negativi senza scappatoie trasversali
            const targetUrl = `https://html.duckduckgo.com/html/?q=${queryCompleta}`;
            
            document.getElementById("searchView").src = targetUrl;
        }
    </script>

</body>
</html>
