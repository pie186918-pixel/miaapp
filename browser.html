<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia - Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* Layout 2 Colonne Affiancate */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .pane {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        .pane-title {
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Barra di Ricerca */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: #38bdf8;
        }

        .search-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #0369a1;
        }

        /* Pulsanti di cambio vista (Siti / Foto) */
        .view-switcher {
            display: none; /* Appare solo dopo la prima ricerca */
            gap: 8px;
            margin-bottom: 12px;
        }

        .view-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: #0284c7;
            color: white;
            border-color: #0284c7;
        }

        /* Contenitore Risultati */
        .results-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .result-card {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 12px 15px;
            border-radius: 10px;
        }

        .result-card a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
        }

        .result-card a:hover {
            text-decoration: underline;
        }

        .result-card p {
            color: #9ca3af;
            font-size: 0.88rem;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* Griglia Immagini */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .image-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            background: #0b0f19;
        }

        .image-card span {
            font-size: 0.75rem;
            color: #d1d5db;
            padding: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Frame IA */
        .ia-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .workspace { grid-template-columns: 1fr; height: auto; }
            .pane { height: 500px; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        
        <!-- COLONNA SINISTRA: BROWSER WEB & FOTO -->
        <div class="pane">
            <div class="pane-title">
                <span>🌐 Omnia Browser</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Cerca qualsiasi cosa..." onkeydown="if(event.key==='Enter') avviaRicercaWeb()">
                <button onclick="avviaRicercaWeb()" class="search-btn">Cerca</button>
            </div>

            <!-- Pulsanti per passare da Siti a Foto dopo la ricerca -->
            <div class="view-switcher" id="viewSwitcher">
                <button class="view-btn active" id="btnWeb" onclick="mostraSitiWeb()">🌐 Siti Web</button>
                <button class="view-btn" id="btnFoto" onclick="mostraFoto()">🖼️ Foto</button>
            </div>

            <div id="resultsList" class="results-container">
                <p style="color: #6b7280; font-size: 0.9rem;">Digita una parola e premi Cerca per esplorare siti e foto.</p>
            </div>
        </div>

        <!-- COLONNA DESTRA: LA TUA IA (ia.html) -->
        <div class="pane" style="padding: 0;">
            <iframe src="ia.html" class="ia-frame"></iframe>
        </div>

    </div>

    <script>
        let ultimaQuery = "";
        let cacheSitiHtml = "";

        async function avviaRicercaWeb() {
            const input = document.getElementById("searchInput");
            const container = document.getElementById("resultsList");
            ultimaQuery = input.value.trim();

            if (!ultimaQuery) return;

            container.innerHTML = "<p style='color: #9ca3af;'>Ricerca in corso...</p>";
            document.getElementById("viewSwitcher").style.display = "flex";
            document.getElementById("btnWeb").classList.add("active");
            document.getElementById("btnFoto").classList.remove("active");

            try {
                const response = await fetch(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(ultimaQuery)}`);
                const htmlText = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const results = doc.querySelectorAll('.result');

                let htmlContent = "";

                if (!results || results.length === 0) {
                    container.innerHTML = "<p style='color: #9ca3af;'>Nessun sito trovato.</p>";
                    return;
                }

                results.forEach(el => {
                    const titleEl = el.querySelector('.result__title');
                    const snippetEl = el.querySelector('.result__snippet');

                    if (titleEl && snippetEl) {
                        const title = titleEl.innerText;
                        const snippet = snippetEl.innerText;
                        const rawHref = titleEl.querySelector('a')?.getAttribute('href') || '#';
                        
                        let cleanUrl = rawHref;
                        if (rawHref.includes('uddg=')) {
                            const match = rawHref.match(/uddg=([^&]+)/);
                            if (match) cleanUrl = decodeURIComponent(match[1]);
                        }

                        htmlContent += `
                            <div class="result-card">
                                <a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${title}</a>
                                <p>${snippet}</p>
                            </div>
                        `;
                    }
                });

                cacheSitiHtml = htmlContent;
                container.innerHTML = cacheSitiHtml;

            } catch (err) {
                cacheSitiHtml = `
                    <div class="result-card">
                        <a href="https://html.duckduckgo.com/html/?q=${encodeURIComponent(ultimaQuery)}" target="_blank">Cerca "${ultimaQuery}" su DuckDuckGo ↗</a>
                    </div>
                `;
                container.innerHTML = cacheSitiHtml;
            }
        }

        function mostraSitiWeb() {
            document.getElementById("btnWeb").classList.add("active");
            document.getElementById("btnFoto").classList.remove("active");
            document.getElementById("resultsList").innerHTML = cacheSitiHtml || "<p style='color: #9ca3af;'>Nessuna ricerca recente.</p>";
        }

        function mostraFoto() {
            if (!ultimaQuery) return;
            document.getElementById("btnFoto").classList.add("active");
            document.getElementById("btnWeb").classList.remove("active");

            const container = document.getElementById("resultsList");
            container.innerHTML = `
                <div style="margin-bottom: 8px; color: #9ca3af; font-size: 0.85rem;">Foto correlate per: <b>${ultimaQuery}</b></div>
                <div class="image-grid" id="imageGrid"></div>
            `;

            const grid = document.getElementById('imageGrid');
            for (let i = 1; i <= 12; i++) {
                const card = document.createElement('div');
                card.className = 'image-card';
                const imgUrl = `https://picsum.photos/seed/${encodeURIComponent(ultimaQuery + i)}/300/200`;
                card.innerHTML = `
                    <a href="${imgUrl}" target="_blank">
                        <img src="${imgUrl}" alt="${ultimaQuery}" loading="lazy">
                    </a>
                    <span>${ultimaQuery} #${i}</span>
                `;
                grid.appendChild(card);
            }
        }
    </script>
</body>
</html>
