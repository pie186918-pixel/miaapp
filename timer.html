<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ora & Timer - Omnia</title>
    <link href="https://i.postimg.cc/MGJgF2VH/foto.png" rel="icon" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/MGJgF2VH/foto.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #38bdf8;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
            gap: 40px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        /* Sezione Ora Esatta (Sinistra) */
        .clock-section {
            text-align: center;
            flex: 1;
            min-width: 280px;
        }

        .clock-section h2 {
            font-size: 1.5rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .clock-display {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            font-family: monospace;
            color: #ffffff;
            letter-spacing: 2px;
        }

        /* Sezione Timer (Destra) */
        .timer-section {
            text-align: center;
            flex: 1;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            backdrop-filter: blur(10px);
        }

        .timer-section h2 {
            font-size: 1.5rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .timer-display {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            font-family: monospace;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        /* Input personalizzato */
        .custom-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .custom-inputs input {
            width: 70px;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-size: 1rem;
        }

        /* Pulsanti */
        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            font-size: 0.95rem;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-preset {
            background: #334155;
            color: #f8fafc;
        }

        .btn-start {
            background: #10b981;
            color: #ffffff;
        }

        .btn-pause {
            background: #f59e0b;
            color: #ffffff;
        }

        .btn-reset {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-set {
            background: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <a href="menu.html" class="back-btn">← Torna al Menu</a>

    <div class="container">
        <!-- Sinistra: Ora Esatta -->
        <div class="clock-section">
            <h2>Ora Esatta</h2>
            <div id="clock" class="clock-display">00:00:00</div>
        </div>

        <!-- Destra: Timer -->
        <div class="timer-section">
            <h2>Timer</h2>
            <div id="timer-display" class="timer-display">01:00:00</div>

            <!-- Suggerimenti rapidi -->
            <div class="btn-group">
                <button class="btn-preset" onclick="setPreset(1)">1 Ora</button>
                <button class="btn-preset" onclick="setPreset(2)">2 Ore</button>
            </div>

            <!-- Inserimento personalizzato -->
            <div class="custom-inputs">
                <input type="number" id="input-h" placeholder="Ore" min="0" max="99">
                <input type="number" id="input-m" placeholder="Min" min="0" max="59">
                <input type="number" id="input-s" placeholder="Sec" min="0" max="59">
                <button class="btn-set" onclick="setCustom()">Imposta</button>
            </div>

            <!-- Controlli del Timer -->
            <div class="btn-group">
                <button id="btn-toggle" class="btn-start" onclick="toggleTimer()">Avvia</button>
                <button class="btn-reset" onclick="resetTimer()">Azzera</button>
            </div>
        </div>
    </div>

    <script>
        // --- ORA ESATTA ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- TIMER ---
        let timerInterval = null;
        let totalSeconds = 3600; // Default: 1 ora
        let initialSeconds = 3600;
        let isRunning = false;

        function updateTimerDisplay() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            document.getElementById('timer-display').textContent = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function setPreset(hours) {
            pauseTimer();
            totalSeconds = hours * 3600;
            initialSeconds = totalSeconds;
            updateTimerDisplay();
        }

        function setCustom() {
            pauseTimer();
            const h = parseInt(document.getElementById('input-h').value) || 0;
            const m = parseInt(document.getElementById('input-m').value) || 0;
            const s = parseInt(document.getElementById('input-s').value) || 0;
            totalSeconds = (h * 3600) + (m * 60) + s;
            initialSeconds = totalSeconds;
            updateTimerDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (totalSeconds <= 0) return;
            isRunning = true;
            const btn = document.getElementById('btn-toggle');
            btn.textContent = "Interrompi";
            btn.className = "btn-pause";

            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateTimerDisplay();
                } else {
                    pauseTimer();
                    alert("Tempo scaduto!");
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            const btn = document.getElementById('btn-toggle');
            btn.textContent = "Avvia";
            btn.className = "btn-start";
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = initialSeconds;
            updateTimerDisplay();
        }

        updateTimerDisplay();
    </script>
</body>
</html>
