<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ora & Timer - Omnia</title>
    <link href="https://i.postimg.cc/MGJgF2VH/foto.png" rel="icon" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/MGJgF2VH/foto.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .back-btn {
            text-decoration: none;
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            flex: 1;
            min-width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .card h2 {
            font-size: 1.2rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Ora Esatta INGRANDITA (6.5rem) */
        .clock-display {
            font-size: clamp(4rem, 8vw, 6.5rem);
            font-weight: bold;
            font-family: monospace;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1;
        }

        /* Timer compattezza mantenuta */
        .timer-display {
            font-size: 2.8rem;
            font-weight: bold;
            font-family: monospace;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            width: 45%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #ffffff;
            text-align: center;
            font-size: 1rem;
        }

        button {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            color: #ffffff;
            flex: 1;
        }

        .btn-preset { background: #374151; }
        .btn-set { background: #0284c7; }
        .btn-start { background: #16a34a; }
        .btn-pause { background: #d97706; }
        .btn-reset { background: #dc2626; }

        button:active { opacity: 0.8; }

        /* Pop-up personalizzato */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #1e293b;
            border: 2px solid #ef4444;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 350px;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
            animation: pulse 1s infinite alternate;
        }

        .modal-box h3 {
            color: #ef4444;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #f8fafc;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .btn-modal-ok {
            background: #ef4444;
            color: #ffffff;
            width: 100%;
            font-size: 1.1rem;
            padding: 12px;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.03); }
        }
    </style>
</head>
<body>

    <a href="menu.html" class="back-btn">← Torna al Menu</a>

    <div class="wrapper">
        <!-- ORA ESATTA -->
        <div class="card">
            <h2>Ora Esatta</h2>
            <div id="clock" class="clock-display">--:--</div>
        </div>

        <!-- TIMER -->
        <div class="card">
            <h2>Timer</h2>
            <div id="timer-display" class="timer-display">01:00:00</div>

            <div class="controls">
                <div class="row">
                    <button type="button" class="btn-preset" onclick="setPreset(1)">1 Ora</button>
                    <button type="button" class="btn-preset" onclick="setPreset(2)">2 Ore</button>
                </div>

                <div class="row">
                    <input type="number" id="input-h" placeholder="Ore" min="0">
                    <input type="number" id="input-m" placeholder="Min" min="0" max="59">
                </div>
                <div class="row">
                    <button type="button" class="btn-set" onclick="setCustom()">Imposta Ora/Min</button>
                </div>

                <div class="row">
                    <button type="button" id="btn-toggle" class="btn-start" onclick="toggleTimer()">Avvia</button>
                    <button type="button" id="btn-reset" class="btn-reset" onclick="resetTimer()">Azzera</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pop-up di avviso tempo scaduto -->
    <div id="alarm-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>TEMPO SCADUTO!</h3>
            <p>Il timer è teminato.</p>
            <button type="button" class="btn-modal-ok" onclick="closeAlarm()">OK / FERMA ALLARME</button>
        </div>
    </div>

    <script>
        // --- ORA ESATTA ---
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = h + ':' + m;
        }
        updateClock();
        setInterval(updateClock, 10000); 

        // --- ALLARME CON BEEP CONTINUI ---
        let audioCtx = null;
        let alarmInterval = null;

        function startAlarm() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            function playSingleBeep() {
                try {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.type = 'sine'; // Suono rotondo e morbido
                    oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota Re
                    
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.3); // Leggermente più lungo
                } catch (e) {
                    console.log(e);
                }
            }

            document.getElementById('alarm-modal').style.display = 'flex';

            playSingleBeep();
            alarmInterval = setInterval(playSingleBeep, 350);
        }

        function closeAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            document.getElementById('alarm-modal').style.display = 'none';
        }

        // --- TIMER ---
        let totalSeconds = 3600;
        let initialSeconds = 3600;
        let timerInterval = null;
        let isRunning = false;

        function renderTimer() {
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            document.getElementById('timer-display').textContent = 
                String(h).padStart(2, '0') + ':' + 
                String(m).padStart(2, '0') + ':' + 
                String(s).padStart(2, '0');
        }

        function setPreset(hours) {
            pauseTimer();
            totalSeconds = hours * 3600;
            initialSeconds = totalSeconds;
            renderTimer();
        }

        function setCustom() {
            pauseTimer();
            let h = parseInt(document.getElementById('input-h').value) || 0;
            let m = parseInt(document.getElementById('input-m').value) || 0;
            totalSeconds = (h * 3600) + (m * 60);
            initialSeconds = totalSeconds;
            renderTimer();
        }

        function toggleTimer() {
            closeAlarm();
            if (totalSeconds <= 0) return;
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (totalSeconds <= 0) return;
            closeAlarm();
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            isRunning = true;
            let btn = document.getElementById('btn-toggle');
            btn.textContent = "Interrompi";
            btn.className = "btn-pause";

            timerInterval = setInterval(function() {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    renderTimer();
                } else {
                    pauseTimer();
                    startAlarm();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            closeAlarm();
            let btn = document.getElementById('btn-toggle');
            btn.textContent = "Avvia";
            btn.className = "btn-start";
        }

        function resetTimer() {
            pauseTimer();
            closeAlarm();
            totalSeconds = initialSeconds;
            renderTimer();
        }

        renderTimer();
    </script>
</body>
</html>
