<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente IA - Omnia</title>
    <link href="https://i.postimg.cc/MGJgF2VH/foto.png" rel="icon" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/MGJgF2VH/foto.png">
    
    <!-- KaTeX per le formule matematiche -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMath()"></script>

    <!-- Marked.js per convertire tabelle e markdown in HTML pulito -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            align-self: flex-start;
            text-decoration: none;
            color: #38bdf8;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex: 1;
            max-height: 85vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.1rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .key-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .reset-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            background: #0b0f17;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeIn 0.2s ease-out;
        }

        /* Stile grafico per le tabelle generate dall'IA */
        .ai-msg table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.85rem;
        }

        .ai-msg th, .ai-msg td {
            border: 1px solid #374151;
            padding: 6px 8px;
            text-align: left;
        }

        .ai-msg th {
            background-color: #1f2937;
            color: #38bdf8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            align-self: flex-end;
            background: #0284c7;
            color: #ffffff;
            border-bottom-right-radius: 2px;
            white-space: pre-wrap;
        }

        .ai-msg {
            align-self: flex-start;
            background: #1f2937;
            color: #f3f4f6;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            resize: none;
            height: 50px;
            font-family: inherit;
        }

        textarea:focus {
            outline: 1px solid #38bdf8;
        }

        .btn-send {
            padding: 0 18px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-send:disabled {
            background: #374151;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <a href="menu.html" class="back-btn">← Torna al Menu</a>

    <div class="card">
        <div class="header">
            <div class="title">Assistente IA Scientifico</div>
            <div class="actions">
                <button class="reset-btn" onclick="nuovaChat()">Nuova Chat</button>
                <button class="key-btn" onclick="impostaApiKey()">Groq Key</button>
            </div>
        </div>

        <div id="chat" class="chat-box">
            <div class="msg ai-msg">Ciao! Sono la tua IA scientifica pronta con LaTeX e tabelle.</div>
        </div>

        <div class="input-row">
            <textarea id="user-input" placeholder="Scrivi un problema o quesito scientifico..."></textarea>
            <button id="send-btn" class="btn-send" onclick="inviaMessaggio()">Invia</button>
        </div>
    </div>

    <script>
        const systemPrompt = {
            role: 'system',
            content: `Sei un assistente scientifico e scolastico rigoroso. 
REGOLA OBBLIGATORIA SUL LATEX: Devi SEMPRE utilizzare la sintassi LaTeX per qualsiasi formula, frazione o espressione matematica/chimica.
Usa i delimitatori \\( ... \\) per le formule in linea e \\[ ... \\] per le formule isolate.
ESEMPI DI COME DEVI SCRIVERE:
- Frazioni: \\( \\frac{a}{b} \\)
- Velocità: \\( v = \\frac{\\Delta s}{\\Delta t} \\)
- Chimica: \\( H_2O \\)
Non scrivere mai formule senza questi tag LaTeX. Quando devi confrontare concetti, usa tabelle in formato Markdown pulite.
Agisci come un professore di seconda liceo scientifico con risposte chiare e non troppo lunghe`
        };

        let cronologia = [systemPrompt];

        function getApiKey() {
            return localStorage.getItem('omnia_groq_key') || '';
        }

        function impostaApiKey() {
            let key = prompt("Inserisci la tua API Key di Groq (gratuita su console.groq.com):", getApiKey());
            if (key !== null) {
                localStorage.setItem('omnia_groq_key', key.trim());
                alert("API Key Groq salvata sul tuo dispositivo!");
            }
        }

        function nuovaChat() {
            cronologia = [systemPrompt];
            const chatBox = document.getElementById('chat');
            chatBox.innerHTML = '<div class="msg ai-msg">Nuova chat avviata! Fammi una domanda.</div>';
        }

        function renderMath() {
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        function ottieniMessaggiOttimizzati() {
            const maxMessaggiStorico = 6;
            const messaggiRecenti = cronologia.slice(-maxMessaggiStorico);
            
            if (messaggiRecenti[0].role !== 'system') {
                return [systemPrompt, ...messaggiRecenti];
            }
            return messaggiRecenti;
        }

        async function inviaMessaggio() {
            const apiKey = getApiKey();
            if (!apiKey) {
                alert("Prima di inviare un messaggio inserisci la tua Groq API Key!");
                impostaApiKey();
                return;
            }

            const inputArea = document.getElementById('user-input');
            const chatBox = document.getElementById('chat');
            const sendBtn = document.getElementById('send-btn');

            const testo = inputArea.value.trim();
            if (!testo) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'msg user-msg';
            userDiv.textContent = testo;
            chatBox.appendChild(userDiv);

            cronologia.push({ role: 'user', content: testo });

            inputArea.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg ai-msg';
            loadingDiv.textContent = 'Calcolando...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;

            const modelli = [
                'openai/gpt-oss-120b',
                'openai/gpt-oss-20b'
            ];

            let rispostaOttenuta = false;
            let dettaglioErrore = '';

            for (const modello of modelli) {
                try {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: modello,
                            messages: ottieniMessaggiOttimizzati(),
                            temperature: 0.2
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.choices && data.choices[0] && data.choices[0].message) {
                        const rispostaIA = data.choices[0].message.content;
                        
                        // Converte il markdown (tabelle e testo) in HTML e applica KaTeX
                        loadingDiv.innerHTML = marked.parse(rispostaIA);

                        cronologia.push({ role: 'assistant', content: rispostaIA });

                        renderMath();
                        rispostaOttenuta = true;
                        break;
                    } else if (data.error) {
                        dettaglioErrore = data.error.message || 'Errore di risposta.';
                    }
                } catch (err) {
                    dettaglioErrore = 'Errore di connessione.';
                }
            }

            if (!rispostaOttenuta) {
                loadingDiv.textContent = "Errore durante l'elaborazione: " + dettaglioErrore;
                cronologia.pop();
            }

            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
