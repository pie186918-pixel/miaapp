<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente IA - Omnia</title>
    <link href="https://i.postimg.cc/MGJgF2VH/foto.png" rel="icon" type="image/png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/MGJgF2VH/foto.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            align-self: flex-start;
            text-decoration: none;
            color: #38bdf8;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex: 1;
            max-height: 85vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.1rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .key-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            background: #0b0f17;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: #0284c7;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            align-self: flex-start;
            background: #1f2937;
            color: #f3f4f6;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            resize: none;
            height: 50px;
            font-family: inherit;
        }

        textarea:focus {
            outline: 1px solid #38bdf8;
        }

        .btn-send {
            padding: 0 18px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-send:disabled {
            background: #374151;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <a href="menu.html" class="back-btn">← Torna al Menu</a>

    <div class="card">
        <div class="header">
            <div class="title">Assistente IA Leggero</div>
            <button class="key-btn" onclick="impostaApiKey()">API Key</button>
        </div>

        <div id="chat" class="chat-box">
            <div class="msg ai-msg">Ciao! Sono la tua IA integrata in Omnia. Inviami pure una domanda.</div>
        </div>

        <div class="input-row">
            <textarea id="user-input" placeholder="Scrivi un messaggio..."></textarea>
            <button id="send-btn" class="btn-send" onclick="inviaMessaggio()">Invia</button>
        </div>
    </div>

    <script>
        function getApiKey() {
            return localStorage.getItem('omnia_gemini_key') || '';
        }

        function impostaApiKey() {
            let key = prompt("Inserisci la tua API Key di Google Gemini (gratuita):", getApiKey());
            if (key !== null) {
                localStorage.setItem('omnia_gemini_key', key.trim());
                alert("API Key salvata sul tuo dispositivo!");
            }
        }

        async function inviaMessaggio() {
            const apiKey = getApiKey();
            if (!apiKey) {
                alert("Prima di inviare un messaggio devi impostare la tua API Key cliccando sul pulsante 'API Key' in alto a destra!");
                impostaApiKey();
                return;
            }

            const inputArea = document.getElementById('user-input');
            const chatBox = document.getElementById('chat');
            const sendBtn = document.getElementById('send-btn');

            const testo = inputArea.value.trim();
            if (!testo) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'msg user-msg';
            userDiv.textContent = testo;
            chatBox.appendChild(userDiv);

            inputArea.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg ai-msg';
            loadingDiv.textContent = 'Pensando...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: testo }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    loadingDiv.textContent = data.candidates[0].content.parts[0].text;
                } else {
                    loadingDiv.textContent = "Errore nella risposta. Verifica la tua API Key.";
                }
            } catch (err) {
                loadingDiv.textContent = "Errore di connessione. Verificare il segnale di rete.";
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
