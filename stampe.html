<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stampe 3D - Omnia</title>
    <link href="foto.png" rel="icon" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            align-self: flex-start;
            text-decoration: none;
            color: #38bdf8;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* TITOLO GRANDE */
        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* MENU DI NAVIGAZIONE CATEGORIE */
        .category-menu {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-btn {
            background: #1f2937;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid #374151;
            transition: 0.2s;
        }

        .cat-btn:hover {
            background: #0284c7;
            border-color: #0284c7;
        }

        /* SEZIONE CATEGORIA E GRIGLIA STAMPE */
        .category-section {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 20px;
            border-bottom: 2px solid #1f2937;
            padding-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* CARD SINGOLA STAMPA */
        .print-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .print-card:hover {
            transform: translateY(-4px);
        }

.print-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;      /* Mantiene le proporzioni e centra l'immagine senza tagliarla */
            object-position: center;  /* Centra l'immagine sia in orizzontale che in verticale */
            background-color: #0b0f17; /* Sfondo scuro per riempire eventuali bordi vuoti */
            padding: 10px;            /* Un minimo di margine per non far toccare i bordi */
            cursor: pointer;
            border-bottom: 1px solid #1f2937;
        }

        .print-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .print-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
        }

        .print-desc {
            font-size: 0.95rem;
            color: #9ca3af;
        }

        .hint {
            font-size: 0.75rem;
            color: #38bdf8;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <a href="menu.html" class="back-btn">← Torna al Menu</a>

    <!-- TITOLO PRINCIPALE -->
    <h1>STAMPE 3D</h1>

    <!-- MENU DI NAVIGAZIONE RAPIDA -->
    <div class="category-menu">
        <!-- 📌 DUPLICA QUESTO BLOCCO PER AGGIUNGERE UN NUOVO BOTTONE CATEGORIA -->
        <a href="#natale" class="cat-btn">Natale</a>
        <a href="#utilita" class="cat-btn">Utilità</a>
        <!-- ================================================================= -->
    </div>

    <!-- SEZIONE NATALE -->
    <div id="natale" class="category-section">
        <h2 class="category-title">Natale</h2>
        <div class="grid">
            
            <!-- 📌 DUPLICA QUESTO BLOCCO (DALL'APERTURA ALLA CHIUSURA DI print-card) PER AGGIUNGERE UNA NUOVA STAMPA -->
            <div class="print-card">
                <!-- IMMAGINE: Doppio click qui avvia il download del file .stl specificato in 'data-stl' -->
                <img src="foto.png" alt="Pallina di Natale" data-stl="file-natale.stl" ondblclick="downloadStl(this)">
                <div class="print-info">
                    <div class="print-title">Pallina di Natale</div>
                    <div class="print-print-desc print-desc">Decorazione classica per l'albero.</div>
                    <div class="hint">💡 Doppio click sull'immagine per scaricare l'STL</div>
                </div>
            </div>
            <!-- ================================================================================================= -->

        </div>
    </div>

    <!-- SEZIONE UTILITÀ -->
    <div id="utilita" class="category-section">
        <h2 class="category-title">Utilità</h2>
        <div class="grid">
            
            <!-- 📌 DUPLICA QUESTO BLOCCO PER AGGIUNGERE ALTRA UTILITÀ -->
            <div class="print-card">
                <img src="foto.png" alt="Supporto Telefono" data-stl="supporto.stl" ondblclick="downloadStl(this)">
                <div class="print-info">
                    <div class="print-title">Supporto Telefono</div>
                    <div class="print-desc">Comodo stand da scrivania regolabile.</div>
                    <div class="hint">💡 Doppio click sull'immagine per scaricare l'STL</div>
                </div>
            </div>
            <!-- ================================================================= -->

        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT PER GESTIRE IL DOWNLOAD AL DOPPIO CLICK -->
    <script>
        function downloadStl(imgElement) {
            const stlFile = imgElement.getAttribute('data-stl');
            const link = document.createElement('a');
            link.href = stlFile;
            link.download = stlFile; // Forza il download del file
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
